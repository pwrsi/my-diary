<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>my diary</title>

  <link rel="stylesheet" href="styles/index.css">
  <link rel="icon" type="image/x-icon" href="images/strawberry.png">
</head>
<body>
  <div class="container">
    <img src="images/strawberry-mini.png" class="decor-top-left" alt="Strawberry">
    <img src="images/strawberry-mini.png" class="decor-bottom-right" alt="Strawberry">

    <div class="content">
      <div class="top">
        <button class="month-year-label" id="month-year-label">
          <span class="month-label" id="month">MONTH</span>
          <span class="year-label" id="year">YEAR</span>
        </button>
  
        <div class="arrows">
          <button class="previous-button" id="previous-button">&#60;</button>
          <button class="next-button" id="next-button">&#62;</button>
        </div>
      </div>

      <div class="days-container">
        <div class="weekdays">
          <p class="weekday">S</p>
          <p class="weekday">M</p>
          <p class="weekday">T</p>
          <p class="weekday">W</p>
          <p class="weekday">T</p>
          <p class="weekday">F</p>
          <p class="weekday">S</p>
        </div>
        
        <div class="days">
          
        </div>
      </div>

    </div>
  </div>

  <div class="month-year-panel panel hidden" id="month-year-panel">
    <div class="inner-content">
      <div class="header">
        <p>Select month or year</p>
        <button class="close-button" id="close-month-year-panel">x</button>
      </div>
        
      <div class="month-year-container">
        <div class="months-container" id="months-container">
          
        </div>
    
        <div class="years-container" id="years-container">
          
        </div>
      </div>
    </div>
  </div>

  <div class="note-panel panel hidden" id="note-panel">

    <div class="inner-content">
      <div class="top">
        <div class="left">
          <button class="close-button" id="close-note-panel"><</button>
        </div>

        <div class="right">
          <div class="date" id="date-selected">09/19/26</div>
          <div class="buttons">
            <button class="stickers-button" id="stickers-button">
              <img src="images/stickers/strawberry-sticker1.png" alt="" title="Stickers">
            </button>
            <button class="save-button" id="save-button">
              <img src="images/save.png" alt="" title="Save">
            </button>
          </div>
        </div>
      </div>

      <div class="note">
        <textarea name="note" id="note"></textarea>
      </div>
    </div>

    
  </div>

  <div class="stickers-panel">
    <div class="inner-content">

    </div>
  </div>

  <!-- <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.21/dayjs.min.js"></script> -->
  <script src="scripts/data.js"></script>
  <script src="scripts/script.js"></script>
  
</body>
</html>
